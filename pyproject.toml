[project]
name = "perf-gate-log-triage"
version = "0.1.0"
description = "CI performance regression gate and log triage tool"
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
perfgate = "perfgate.cli:main"
logtriage = "logtriage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["perfgate", "logtriage"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
